<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Offline - Aquado Driver</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(160deg, #1B4332 0%, #2D6A4F 50%, #40916C 100%);
            color: #fff;
        }
        img { width: 96px; height: 96px; }
        h1 { margin: 0; font-size: 22px; }
        p { margin: 0; opacity: 0.9; max-width: 320px; line-height: 1.5; }
        button {
            margin-top: 8px;
            padding: 12px 28px;
            border: none;
            border-radius: 999px;
            background: #fff;
            color: #1B4332;
            font-weight: 700;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <img src="assets/logo.svg" alt="Aquado">
    <h1>You're offline</h1>
    <p>The Aquado Driver app needs an internet connection to load your deliveries. Check your mobile data or Wi-Fi.</p>
    <button type="button" onclick="location.reload()">Try Again</button>
</body>
</html>
